name: NoxaPhone
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  NoxaPhone:
    type: application
    platform: iOS
    sources:
      - Phone
      - path: ../App
        excludes: [Browse.swift, Assets.xcassets]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.emerytech.screenroom.tv
      DEVELOPMENT_TEAM: XK6QP975ZQ
      TARGETED_DEVICE_FAMILY: 1
      INFOPLIST_FILE: Info.plist
      SWIFT_VERSION: "5.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: 22
  PhoneTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PhoneTests]
    dependencies: [{target: NoxaPhone}]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.emerytech.screenroom.phone-tests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: NoxaPhone
schemes:
  NoxaPhone:
    build:
      targets: {NoxaPhone: all}
    test:
      targets: [PhoneTests]
